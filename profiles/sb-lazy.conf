# ============================================================================
# Surge 懒人配置 · Surfboard 兼容版
# ============================================================================
# ⚠️ 导入前必须改一处：把 [Proxy Group] 里 `Airport` 那行的 policy-path
#    换成你自己的真实订阅地址 —— 且必须是 **Surge 格式**的订阅（不是 Clash/YAML）。
#    改之前导入会报 connection closed / HTTP 400：Surfboard 在导入时会真去
#    拉这个地址，拉不到就直接断，不给友好提示。
#
# 与 Surge 正式版的差异（为兼容 Surfboard 刻意去掉）：
#   · 首行 `#! version=` → 普通注释（Surfboard 把它当特殊指令头解析）
#   · 删 [URL Rewrite] 段        · 删 [SSID Setting] 段
#   · 删规则行上的 pre-matching / extended-matching（Surge 专有参数）
#   · 删全部 icon-url（Surfboard 不认，写了会被忽略）
#   · 删 [General] 里 Surfboard 无对应实现的新式键
# ============================================================================

# 版本 lazy_v2.0.5
# ============================================================================
# Surge 懒人配置 · 防 DNS 泄露 + 广告拦截 + AI 分流
#
# 防 DNS 泄露结构 + 广告拦截（带白名单） + AI 分流 + 局域网共享。
#
# ⚠️ 本文件是**脱敏模板**：订阅 URL 等均为占位符。
#    导入前把 [Proxy Group] 里的 `Airport` 订阅链接
#    换成你自己的（至少一项），否则**所有走代理的流量都不通**。
#
# 结构（自上而下）：
#   [General]       全局：加密 DNS / IPv6 / GeoIP / 测试端点 / 安全开关
#   [Proxy]         节点：全部来自订阅（本段不写死任何节点）
#   [Proxy Group]   策略组：Proxy / AI / AD + `Airport` 订阅槽位（隐藏）
#   [Rule]          规则：白名单 → 广告拦截 → 系统域 → 内网 → AI → 国内 → 兜底
#   [Host] / [URL Rewrite]
#
# 防泄露的三条原则见 README 的「防泄露原理」一节，逐行理由见各段注释。
#
# audit-waive: 1 加密 DNS 端点保留 2 个主机名形式（dns.google / dns.alidns.com）。
#   这两个名字会被引导解析一次 —— 这是**刻意的取舍**，不是漏改：
#   换成纯 IP 字面量能消掉这一次解析，但会失去「按域名走 CDN 就近解析」与
#   「ECS 合规（不把公网 IP 交给非 CDN 的解析器）」两项收益。
#   消费者可自行取舍：想彻底消掉就把它们换成 IP 字面量。
# ============================================================================

[General]
# （Surge 的 `loglevel` 不在 Surfboard 官方语法参考的 [General] 键表内 —— 未收录即不支持，已删。）

# --- DNS：加密、端点钉 IP、无明文通路 ----------------------------------------
# dns-server 必须写裸 IP，**绝不能写 system** —— 它只用于给加密 DNS 端点做
# 引导与连通性测试，如果它依赖系统解析器，就等于把引导过程交给了运营商 DHCP。
# 加密 DNS 端点全部写成 IP 字面量，因此启动期**没有任何主机名需要被明文解析**。
dns-server = 223.5.5.5, 119.29.29.29, 1.1.1.1, 8.8.8.8
# 加密 DNS 连接一律走直连。保持 false 是为了避免 DoH 连接被绕回代理链形成环。
# ⚠️ Surfboard 无 `hijack-dns`（官方语法参考 [General] 键表未收录）—— 已删。
#   硬编码解析器的明文 :53 查询不再被本机接管，但也不会裸奔：它们会命中
#   GEOIP 非 CN 而走代理（节点侧解析）；节点不支持 UDP 时按
#   `udp-policy-not-supported-behaviour = reject` 拒绝 —— 泄露面仍是零，
#   只是拿不到 Surge 那种「本机直接应答」的效果。
# 保持 false：本地映射只服务 DIRECT 路径。开启会把本地 DNS 结果变成硬性代理目标，
# 破坏远端解析（走代理的域名应该由节点侧解析，本地不该有它的答案）。

# --- IPv6 ------------------------------------------------------------------
# ipv6 = false：不向客户端返回 AAAA 记录，双栈站点自动回落 IPv4。封堵面因此
# 与 Egern 内核等效（Egern 侧默认不启用 IPv6），AAAA 绕过面收窄。
# ipv6-vif = disable：IPv6 已关，VIF 不再承载任何 IPv6 路径。
# （2026-09-29 实测：false + disable 不影响 DNS 泄露面，官方对无 v6 需求的
# 用户亦建议保持关闭；原「真实 IPv6 可直连」的收益让位于封堵面一致性。）
ipv6 = false

# --- GeoIP -----------------------------------------------------------------
# 第三方手工构造的 mmdb 不一定带官方签名；自动更新保持开启，
# 若日志里出现更新报错，用这个开关关掉即可。

# --- 连通性与延迟测试 --------------------------------------------------------
test-timeout = 5
internet-test-url = http://connect.rom.miui.com/generate_204
# 延迟测试端点用**境外** 204。
#
# ⚠️ 它是**性能探针**，不是泄露通道 —— 别拿"藏掉解析"的理由去改它。
# 走代理策略时解析发生在代理服务器（官方 KB：「DNS 解析永远在代理服务器进行」），
# 本地不产生查询。它的职责是给 smart 组 / 地区组打分，
# 而**分流版尤其依赖这个分数**：地区组的整个意义就是"同地区的节点谁最快"，
# 用境外端点测出的延迟含国际段，才贴近你真实访问境外站点的体感。
proxy-test-url = http://www.gstatic.com/generate_204
# 专用的 UDP 探针（QUIC 类策略 + smart 组的 UDP 评分都要用它）。

# --- 流量处理 ---------------------------------------------------------------
# 有节点不支持 UDP 时，让请求走代理侧解析后的 TCP，而不是直接失败。
udp-policy-not-supported-behaviour = reject
# 游戏模式：系统繁忙时优先处理 UDP 包。
# 代理策略默认已阻止 QUIC；这里显式声明，只在确实有用的地方放行 QUIC。

# --- 局域网共享与安全 --------------------------------------------------------
# 两者保持 false：局域网设备的共享出口由专用网关承担，本机不再开放代理
# 监听端口，暴露面直接归零。proxy-restricted-to-lan 保留：监听端口万一
# 重新启用时仍有子网锁兜底。

# --- Wi-Fi / 蜂窝行为 -------------------------------------------------------
# all-hybrid = true 会让每条 TCP 连接**和**每次 DNS 查询同时走 Wi-Fi + 蜂窝，
# 是明确的耗电与流量代价。保持 false。

# Real-IP 豁免：游戏机 / NTP / STUN 主机名必须拿到真实可路由地址而不是 fake-IP，
# 否则 NAT 类型检测和时间同步会坏。注意 Surge 内置的 SYSTEM 集合已覆盖 Apple 自家流量。
always-real-ip = *.lan, *.local, *.localdomain, *.home.arpa, *.srv.nintendo.net, *.stun.playstation.net, *.xboxlive.com, stun.*, time.*.com, ntp.*.com, *.pool.ntp.org, *.market.xiaomi.com

# ===========================================================================

[Proxy]
# 本段**不写死任何节点** —— 全部节点来自订阅（`Airport` 的 `policy-path`）。
# 要加自己的节点就照这样写：`名字 = 类型, 服务器, 端口, 参数…`
#   ⚠️ server 写成 IP 字面量（不是域名）：IP 节点不产生"解析节点域名"这次查询。
#   ⚠️ download-bandwidth 刻意不设置：它是**服务端**拥塞控制提示，填错会导致
#      bufferbloat / 无谓重传。除非服务商明确公布数字，否则交给服务端决定。
#
# --- 内置策略别名（可选，当前未使用）-----------------------------------------
# Surge 允许在 [Proxy] 段给内置策略起别名，例如：
#   AdBlock = reject
# 之后就能在规则和策略组里使用这个名字。
#
# 下面那条广告规则**刻意没有**用别名，而是直接写字面量 REJECT。
# 原因：pre-matching 的校验对策略要求严格（必须是 REJECT 族**策略**本身），
# 字面量内置名保证能过。确认配置能正常加载后，如果你更喜欢具名策略，再改。
#
# ⚠️ 同样地，广告拦截**不能**指向一个策略组（哪怕该组只有 REJECT 一个成员）：
#    策略组在运行时可以解析成 DIRECT，Surge 会直接拒绝加载整份配置。
#    这也是本配置让拦截动作走字面量 REJECT、而 AD 组独立存在的原因（见下）。

# ===========================================================================

[Proxy Group]
# 订阅槽位。只做一个入口：把订阅链接里的节点拉进来。
# `hidden=true` 让它不在面板菜单里显示 —— 它本来就不该被手动选中，
# 引用它的永远是下面两个组的 `include-other-group="Airport"`。
#
# ⚠️ 把 URL 换成你自己的订阅。token 已用占位符，不含任何真实机场地址。
Airport = select, policy-path=https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN, update-interval=86400, hidden=true

# smart 组：按**真实连接的首字节延迟**、TCP 重传丢包（每 1% 约 50ms）、
# UDP 响应延迟三项给成员打分，固定 5 分钟重测一次，并记住每个站点用哪个策略最合适。
# 两个组的成员都只有订阅里的节点（本文件不写死节点）。
#
# ⚠️ smart 不能把别的组当子策略，但可以用 `include-other-group` **复制**对方已解析出来的
#    成员 —— 所以这里写 `include-other-group="Airport"` 拿到的是订阅里的具体节点，
#    不是"Airport 这一个组单位"。懒人版的订阅节点直接进这两个组（分流版相反：
#    订阅只进 Smart / 地区组）。
#
# 本组不写这几个键，理由分别是：`update-interval` 对 smart 组是空转（只在订阅型组里有意义）；
# `include-all-proxies=0` / `no-alert=0` / `hidden=0` 都已是默认值。
Proxy = smart, include-other-group="Airport"

# AI 组改 select（2026-09-28）：AI 出口必须手动钉死 —— smart 的周期打分会让出口 IP
# 在订阅池里漂移，而 Google/OpenAI 的账号风控对出口频繁跳变极敏感（社区共识：
# AI 流量用手动选择，不用自动测速）。面板上把本组固定到一条稳定同区节点。
AI = select, include-other-group="Airport"

# AD 组：独立的手动开关，不被规则引用 —— 这是刻意的分层，不是遗漏。
# 职责划分：拦截动作走字面量 REJECT（为了拿到 pre-matching 的 DNS 阶段拦截），
#            AD 组负责"面板上随时可切，给人工干预留一个入口"。
# 改默认拦截行为：改 [Rule] 里那条 RULE-SET 的策略，或整行注释掉。
# 想让 AD 直接接管开关：把那行策略从 REJECT 改成 AD，但要一并去掉 pre-matching。
AD = select, REJECT

# ⚠️ 懒人版**没有** `Apple Update` 组（2026-10-06 定）：系统更新分流只在分流版提供。
#    懒人版的取向是「全量流量一个出口」，不为此再开一个组；
#    OTA 域名在懒人版由下面的 `SYSTEM` 接成 `DIRECT`（与旧版行为一致）。

# ===========================================================================

[Rule]
# ---- 1. 广告白名单（防误杀层）----------------------------------------------
# 白名单是**最高优先级**：必须排在广告拦截（REJECT）之前，否则会被误杀。
# 顺序铁律「白名单 → 黑名单 → 常规分流」里的**白名单**即本节。
# ⚠️ **两层白名单的第二层（系统域 `SYSTEM`）不在此处**：2026-10-06 起它下移到
#     `2c`（广告拦截之后、内网之前），依据见 2c 段注释。
#
# 广告白名单 —— 会被广告黑名单误杀的功能域
# 必须排在广告拦截**之前**：这批域名是会被黑名单误杀的功能域
# （条数随上游更新，故此处不写死；要现值跑 audit_ruleset_content.py），
# 要抢在 REJECT 之前放行。
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-direct.list,DIRECT,"update-interval=604800"

# ---- 2. 广告拦截：pre-matching REJECT --------------------------------------
# pre-matching 的 REJECT 在 **DNS 查询阶段和 TCP-SYN 阶段**就被求值，
# 被拦的请求得到一个 "No Record" / TCP RST 就结束了，连接层完全不会启动。
# 对一个广告密集的配置来说，这是最大的一笔 CPU 与耗电优化。
#
# 策略必须是**字面量** REJECT 族策略。写成策略组会加载失败：组的成员在运行时
# 可能解析成 DIRECT，Surge 无法据此保证"一定拦得住"。
#
# 已核对该规则集的类型分布：38xx 条全部是 DOMAIN-SUFFIX / DOMAIN-WILDCARD，
# 都是 pre-matching 可用的类型。没有任何 IP-CIDR / USER-AGENT / URL-REGEX 条目。
#
# 想临时停用广告拦截：把策略改成 DIRECT，或整行注释掉。
#
# pre-matching  : 提前到 DNS / 连接阶段生效，最接近 Jinx 那种系统级 DNS 拦截体验
# extended-matching: 额外按 TLS SNI / HTTP Host 匹配，专治「App 直连 IP 导致域名规则失效」
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-ads.list,REJECT,"update-interval=604800"

# ---- 2b. 第二条广告清单：AWAvenue（秋风）------------------------------------
# 与 Egern 的两条并列结构对齐（先 Jinx、后 AWAvenue），策略与参数同 2 号，同为
# pre-matching REJECT —— 拦在 DNS / TCP-SYN 阶段，不额外起连接。
#
# 已核对该规则集本体（2026-09-22；条数随上游更新，不写死）：
#   DOMAIN 949 / DOMAIN-SUFFIX 12 / DOMAIN-KEYWORD 4，**100% 域名类**，
#   无 IP-CIDR / URL-REGEX / USER-AGENT ⇒ pre-matching 可用的类型。
#
# 补它的收益（按「净新增覆盖」量化，不是看总条数）：
#   相对 Jinx 黑名单，仍有少数 Jinx 未收录的广告域（具体数随两条清单上游更新而变，
#   要现值就现抓：`python skill/scripts/surge/audit_ruleset_content.py <本文件>`）。
#
# ⚠️ 顺序是这条的命门：AWAvenue 会命中上面白名单里的若干条功能域
#   （`jpush.cn` / `appcfg.v.qq.com` / 微信登录 `apd-pcdnwx*` / 字节 `tnc3-*` 等）。
#   白名单必须留在两条清单**之前**，否则这些域名会被误杀。
#   ⚠️ 这条**不能**挪到 `direct.txt` / `GEOIP,CN` 之后 —— 一旦落到国内直连规则后面就永远轮不到。
RULE-SET,https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list,REJECT,"update-interval=604800"

# ---- 2c. 系统域白名单（`SYSTEM`）—— 排在广告拦截之后、内网之前 ---------------
#     Apple 的激活 / 推送 / 定位 / 配对主机（mesu / captive / push / ess / lcdn-* 等）。
#     它是 Surge **内置**集合：不依赖网络下载，规则集加载失败也不会失效。
#     ⚠️ **落点依据（2026-10-06 变更）**：原口径是「系统域优先级高于一切 ⇒ 置顶」。
#        现改为**不置顶、落在两条广告拦截之后、内网之前**，依据是下面这条实测：
#          · 与两条广告清单**零交集**（裸域名与后缀覆盖均为 0，2026-10-06 复测仍成立）
#            ⇒ 排在前或排在后，**拦截结果完全相同**。
#        ⇒ 顺序对结果无影响时，不再占用「最前」这个语义位置。
#     ⚠️ **懒人版不设 `Apple Update` 组**（仅分流版有）：OTA 域名在懒人版由本集合接成 `DIRECT`。
#     ⚠️ 内置 `SYSTEM` 不含 App Store / iTunes 内容服务（官方口径，见 `rules/apple_system.list` 头注）。
#     ⚠️ Egern 侧没有内置 `SYSTEM`：同一位置引用本仓自托管快照 `rules/apple_system.list`。
#     ⚠️ Surfboard 同样**没有** `RULE-SET,SYSTEM`（官方语法参考明示不支持）—— 与 Egern
#        同法，引用本仓自托管的 SYSTEM 快照（同一 URL）。代价：快照不随 Surge 版本自动
#        更新、多一次下载；但「系统域白名单」这条语义保住了，不至于整段丢掉。
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/rules/apple_system.list,DIRECT,"update-interval=604800"

# ---- 3. 局域网 / 内网 -------------------------------------------------------
# 内网排在广告之后、应用分流之前 —— 与 Egern 懒人版逐位同构（见 skill/reference/shared/rulesets.md §3）。
#
# ⚠️ Surfboard 不支持 `RULE-SET,LAN`（官方语法参考明示）—— 内置 LAN 的 IP 段在这里
#   逐条展开成 IP-CIDR（IP 规则官方支持 no-resolve）：语义等价，且这些行对未解析
#   主机名**跳过**而不是触发本地解析 —— 泄露面与内置 LAN 持平。
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.0.0.0/24,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,198.18.0.0/15,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,240.0.0.0/4,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
IP-CIDR6,ff00::/8,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/private.txt,DIRECT,"update-interval=604800"


# ---- 5. AI / OpenAI --------------------------------------------------------
# 实测零 IP 条目（全为域名类）⇒ 不写规则级 no-resolve，见 6 号那段。
RULE-SET,https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/AI.list,AI,"update-interval=604800"
# 本仓自托管整合集：伴生域/宽后缀(googleapis.com 等) + 认证遥测基础设施域，与上行同指 AI 组
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/rules/AI.list,AI,"update-interval=604800"

# ---- 6. 国内直连（域名类，主承重墙）-----------------------------------------
# 规则级 no-resolve 的取舍，本仓四份 profile 共用一条原则：
#   **实测零 IP 条目的规则集不写，真含 IP 条目的必须写。**
# 那个开关只对规则集里的 IP 类条目起作用：纯域名集写上是空转；含 IP 的集不写，就会让
# 每个还没被前面命中的域名在这里**被强制本地解析一次** —— 那正是泄露本身。
# 本份文件里"真含 IP"的只有上面展开的内网段（IP-CIDR 行，自带 no-resolve）和下面的 `GEOIP,CN`。
# ⚠️ 判据是**实测零 IP**，不是"纯域名"：`YouTubeMusic` / `Microsoft` 那类含
#    USER-AGENT / PROCESS-NAME 的集同样零 IP，依据要写准（分流版 §3 有逐个实测表）。
#
# direct.txt 是国内直连的主力（纯域名集、零 IP 条目）—— 下面那条 GEOIP,CN
# 因为带 no-resolve 已经不再匹配域名，所以国内域名**只能靠这里**接住。
# ⚠️ 条数**不写死**（清单每周随上游更新，写进注释的精确数必然过期）：
#    要现值就现抓 `python skill/scripts/surge/audit_ruleset_content.py <本文件>`。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt,DIRECT,"update-interval=604800"

# ---- 7. IP 规则，放最后 -----------------------------------------------------
# IP 类规则需要有已解析的地址。放在所有域名规则之后，使走代理 / 被广告拦截 /
# 国内直连的流量都不必做本地 DNS 查询。
# no-resolve 让它对未解析的主机名**跳过**，而不是暂停规则求值去解析它。
GEOIP,CN,DIRECT,no-resolve

# ---- 8. 兜底 ---------------------------------------------------------------
# ⚠️ Surfboard 的 FINAL 只接受 `FINAL,{target}`（官方语法参考），不支持 Surge 的
#   `dns-failed` 修饰符 —— 已删。域名请求在 fake-IP 模式下规则求值不依赖本地解析
#   （`always-real-ip` 列表内的除外），DNS 失败中断求值的场景因此大幅收窄。
FINAL,Proxy

# ===========================================================================

[Host]
# 只列 Surge 自带 DNS 客户端可能处理错的那几个特殊主机名。
# localhost 内部就能解析，*.lan 已被 exclude-simple-hostnames + LAN 规则覆盖，
# 再映射一遍是冗余的。
localhost = server:system
*.lan = server:system
*.local = server:system
