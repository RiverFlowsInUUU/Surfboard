# ---- 3e. 禁用条目（与 Egern 对齐）------------------------------------------
# blackmatrix7 Proxy.list：注释掉 = 不参与匹配、不占 [Rule] 的一位
# （Surge 的 RULE-SET 没有 disabled 字段，只能注释）。与 Egern 侧同位对齐。
# RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Proxy/Proxy.list,Proxy

# ---- 5. Apple 服务直连 ------------------------------------------------------
# 这一节对应 Egern 里的 `Apple` 那条（`apple.txt -> DIRECT`）；
# Egern 在它上面还多一条 `System` —— 那是本仓自托管的内置 `SYSTEM` 时点快照，占位 ⑲，
# 与本节下面那条 `RULE-SET,SYSTEM` 同位。两侧 24 条逐位对齐由它成立。
#
# 为什么是**两条**而不是一条：
#   - `SYSTEM` 是 Surge 内置集合，很小但权威（Apple 的激活 / 推送 / 定位 / 配对主机），
#     不依赖网络下载，加载失败也不会失效 —— 留它做**保底**。它与 `apple.txt` 只重叠 9 条，
#     独有 9 条（captive / api.smoot / ls / push / ess / lcdn-* ）**只有它接得住**。
#   - `apple.txt`（Loyalsoldier `surge-rules` release）**纯域名集**（条数随上游更新，不写死），是「Apple 服务」的
#     实际承担者：apps.apple.com / itunes.apple.com / mesu / swcdn / oscdn / gs-loc /
#     store.apple.com / www.apple.com / init*.push.apple.com / a1-a5·is1-5.mzstatic.com …
#   两条都在 => 覆盖面 + 兜不丢，且因为有 SYSTEM 在前，即便规则集下载失败也退化得可接受。
#
# ⚠️ 零 IP 条目 ⇒ **不写规则级 no-resolve**（本仓原则 4b：实测零 IP 的不写，真含 IP 的必须写）。
#    它与 `direct.txt` 同仓库、同 release、同格式，刷新口径也一致。
#
# 为什么用 `apple.txt` 而不是 Apple 全量集：
#   ① 全量集含 13 条 IP-CIDR（在 no-resolve 语义下对域名请求不参与匹配）+ 23 条 USER-AGENT
#      （无 MITM 的 iOS 上无效）+ 13 条 PROCESS-NAME（仅 Surge Mac 生效）—— 对 iOS 是死重量；
#   ② 它把解析到境外的 Apple 域也强制直连（developer.apple.com、国际版 iCloud 端点、
#      apple-cloudkit.com …），对国内用户反而更慢。`apple.txt` 只留「在中国大陆可直连」的部分。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/apple.txt,DIRECT,"update-interval=604800"

# ---- 6. 国内直连（域名类，主承重墙）-----------------------------------------
# 实测零 IP 条目 ⇒ 按 §3 那条原则去掉了原先写在规则上的 no-resolve。它是国内直连的主力 ——
# 下面那条 GEOIP,CN 因为带 no-resolve 已经不再匹配域名，所以国内域名**只能靠这里**接住。
# ⚠️ 条数**不写死**（这份清单每周随上游更新，写进注释的精确数必然过期）：
#    要现值就现抓：`python skill/scripts/surge/audit_ruleset_content.py <本文件>`
#    —— 它逐个数每个规则集的「共 N 条：域名类 / IP 类」，别照抄本注释。
#
# ⚠️ 分流版与 lazy.conf 在这一点上**完全一致**：国内域名直连不靠 geoip，靠这份清单。
#    这也是为什么本文件不需要 Egern 的 `domain_suffix: cn` 兜底 —— direct.txt 已含 .cn。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt,DIRECT,"update-interval=604800"

# ---- 7. IP 规则，放最后 -----------------------------------------------------
# IP 类规则需要有已解析的地址。放在所有域名规则之后，使走代理 / 被广告拦截 /
# 国内直连的流量都不必做本地 DNS 查询。
# no-resolve 让它对未解析的主机名**跳过**，而不是暂停规则求值去解析它。
GEOIP,CN,DIRECT,no-resolve

# ---- 8. 兜底 ---------------------------------------------------------------
# ⚠️ Surfboard 的 FINAL 只接受 `FINAL,{target}`（官方语法参考），不支持 Surge 的
#   `dns-failed` 修饰符 —— 已删。域名请求在 fake-IP 模式下规则求值不依赖本地解析
#   （`always-real-ip` 列表内的除外），DNS 失败中断求值的场景因此大幅收窄。
FINAL,Proxy

# ===========================================================================

[Host]
# 只列 Surge 自带 DNS 客户端可能处理错的那几个特殊主机名。
# localhost 内部就能解析，*.lan 已被 exclude-simple-hostnames + LAN 规则覆盖，
# 再映射一遍是冗余的。
localhost = server:system
*.lan = server:system
*.local = server:system
