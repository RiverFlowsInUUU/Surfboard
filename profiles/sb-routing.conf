RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/rules/emby.list,Emby,"update-interval=604800"
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list,Google,"update-interval=604800"
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list,Telegram,"update-interval=604800"
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list,Spotify,"update-interval=604800"
