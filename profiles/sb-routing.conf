# ---- 3. 按应用分流（粒度最细的规则放最前面）--------------------------------
# 顺序铁律：**越具体的越靠前**。这些应用规则必须排在下面的国内直连集之前，
# 否则一个 「ChatGPT 但域名恰好被国内清单收录」的场景会被直连接走。
#
# 规则级 no-resolve 的取舍（Surge 侧原则，本仓四份 profile 共用）：
#   **实测零 IP 条目的规则集不写，真含 IP 条目的必须写。**
# ⚠️ 2026-10-10 订正：官方语法参考明示 Surfboard 的 no-resolve 只接受在 IP 类规则
#   （IP-CIDR/IP-CIDR6/GEOIP）上，RULE-SET 行不支持 —— 本文件 RULE-SET 行的
#   no-resolve 已全部删去。「含 IP」的集（OpenAI/YouTube/Google/Telegram/Spotify/Twitter）
#   在 Surfboard 上会被强制本地解析一次再比对 IP 条目；这是引擎能力差异，无法规避，
#   Surge 侧继续保留原写法。
# 那个开关只对规则集里的 IP 类条目起作用：纯域名集写上是空转；含 IP 的集不写，就会让
# 每个还没被前面命中的域名在这里**被强制本地解析一次** —— 那正是泄露本身。
# 逐个下载实测（2026-09-24，`skill/scripts/surge/audit_ruleset_content.py`）：
#   零 IP ⇒ 已去掉开关：Gemini / Anthropic / Claude / AI.list / YouTube Music / Microsoft
#   含 IP ⇒ 保留：OpenAI 3 · Spotify 2 · YouTube 3 · Google 5 · Telegram 15 · Twitter 6
# ⚠️ 判据是「实测零 IP」，不是「纯域名」：YouTube Music 有 4 条 USER-AGENT、Microsoft 有
#    UA 3 + PROCESS-NAME 2，同样零 IP ⇒ 开关同样是空转。
#    这些 URL 没锁 commit、条目数会随上游变 ⇒ "该不该写"每次由那条审计重测，不靠记忆。
#
# ⚠️ 组内顺序也是刻意的：厂商专属规则（OpenAI / Gemini / Anthropic / Claude）
#    必须排在通用 `AI.list` **之前**，否则 AI 域名会先被 AI.list 接走，
#    永远轮不到 ChatGPT / Gemini / Claude 组。

