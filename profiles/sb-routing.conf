# ============================================================================
# Surge 分流配置 · Surfboard 兼容版
# ============================================================================
# ⚠️ 导入前必须改一处：把 [Proxy Group] 里 `Airport` 那行的 policy-path
#    换成你自己的真实订阅地址 —— 且必须是 **Surge 格式**的订阅（不是 Clash/YAML）。
#    改之前导入会报 connection closed / HTTP 400：Surfboard 在导入时会真去
#    拉这个地址，拉不到就直接断，不给友好提示。
#
# 与 Surge 正式版的差异（为兼容 Surfboard 刻意去掉）：
#   · 首行 `#! version=` → 普通注释（Surfboard 把它当特殊指令头解析）
#   · 删 [URL Rewrite] 段        · 删 [SSID Setting] 段
#   · 删规则行上的 pre-matching / extended-matching（Surge 专有参数）
#   · 删全部 icon-url（Surfboard 不认，写了会被忽略）
#   · 删 [General] 里 Surfboard 无对应实现的新式键
# ============================================================================

# 版本 routing_v4.0.5
# ============================================================================
# Surge 分流配置 · 按应用 + 按地区选路
#
# 与 lazy.conf 的分工：
#   lazy.conf     极简 —— 4 个策略组（含 `Airport` 订阅槽），全量流量一个出口，
#                 只做「防泄露 + 广告拦截 + AI」
#   routing.conf 分流 —— 按应用分组（ChatGPT / Claude / AI / Google …），
#                 Smart / 地区组内部还可继续按地区或倍率选优
#
# 两份的 [General] DNS 段与防泄露结构**完全一致**（由测试逐字断言），
# 差别只在 [Proxy Group] 的粒度。选一个用即可，不要叠加。
#
# ⚠️ [Proxy Group] 的**组顺序与 Egern 对齐**，段序如下：
#    ① 总入口 → ② 应用组 → ③ 订阅槽位 + 开关 → ④ 地区 / 精选 → ⑤ 兜底
#    这样排的道理是「先写引用别人的，后写被引用的」——
#    读配置时先看到"谁在用"，再看"节点从哪来"，不用来回跳。
#
# ⚠️ 本文件是**脱敏模板**：
#   · `[Proxy]` 段**不带任何写死的节点**：全部节点来自订阅（`Airport` 的 `policy-path`）。
#   · 订阅 URL 里只有域名与 token 占位符，**不含任何真实机场地址**。
#   导入时只需替换 `Airport` 的订阅 URL —— 导入后 `Proxy` / `Smart` / `AI`
#   与 6 个地区组全部从订阅取节点，无需再手工填任何一条。
#
# 结构（自上而下）：
#   [General]       全局：与 lazy.conf 逐字相同
#   [Proxy]         节点：全部来自订阅（本段不写死任何节点）
#   [Proxy Group]   策略组：Proxy → Smart → 应用组 → Airport / AD
#                           → 地区组
#   [Rule]          规则：白名单 → 广告拦截 → Apple 更新 → 系统域 → 内网 → 各应用 → Apple → 国内 → IP → 兜底
#   [Host] / [URL Rewrite]
#
# audit-waive: 1 加密 DNS 端点保留 2 个主机名形式（dns.google / dns.alidns.com）。
#   这两个名字会被引导解析一次 —— 这是**刻意的取舍**，不是漏改：
#   换成纯 IP 字面量能消掉这一次解析，但会失去「按域名走 CDN 就近解析」与
#   「ECS 合规（不把公网 IP 交给非 CDN 的解析器）」两项收益。
#   消费者可自行取舍：想彻底消掉就把它们换成 IP 字面量。
# ============================================================================

[General]
# （Surge 的 `loglevel` 不在 Surfboard 官方语法参考的 [General] 键表内 —— 未收录即不支持，已删。）

# --- DNS：加密、端点钉 IP、无明文通路 ----------------------------------------
# dns-server 必须写裸 IP，**绝不能写 system** —— 它只用于给加密 DNS 端点做
# 引导与连通性测试，如果它依赖系统解析器，就等于把引导过程交给了运营商 DHCP。
# 加密 DNS 端点全部写成 IP 字面量，因此启动期**没有任何主机名需要被明文解析**。
dns-server = 223.5.5.5, 119.29.29.29, 1.1.1.1, 8.8.8.8
# 加密 DNS 连接一律走直连。保持 false 是为了避免 DoH 连接被绕回代理链形成环。
# ⚠️ Surfboard 无 `hijack-dns`（官方语法参考 [General] 键表未收录）—— 已删。
#   硬编码解析器的明文 :53 查询不再被本机接管，但也不会裸奔：它们会命中
#   GEOIP 非 CN 而走代理（节点侧解析）；节点不支持 UDP 时按
#   `udp-policy-not-supported-behaviour = reject` 拒绝 —— 泄露面仍是零。
#   Surge 侧保留原行为；跨引擎切换时知晓此差异即可。
# 保持 false：本地映射只服务 DIRECT 路径。开启会把本地 DNS 结果变成硬性代理目标，
# 破坏远端解析（走代理的域名应该由节点侧解析，本地不该有它的答案）。

# --- IPv6 ------------------------------------------------------------------
# ipv6 = false：不向客户端返回 AAAA 记录，双栈站点自动回落 IPv4。封堵面因此
# 与 Egern 内核等效（Egern 侧默认不启用 IPv6），AAAA 绕过面收窄。
# ipv6-vif = disable：IPv6 已关，VIF 不再承载任何 IPv6 路径。
# （2026-09-29 实测：false + disable 不影响 DNS 泄露面，官方对无 v6 需求的
# 用户亦建议保持关闭；原「真实 IPv6 可直连」的收益让位于封堵面一致性。）
ipv6 = false

# --- GeoIP -----------------------------------------------------------------
# 第三方手工构造的 mmdb 不一定带官方签名；自动更新保持开启，
# 若日志里出现更新报错，用这个开关关掉即可。

# --- 连通性与延迟测试 --------------------------------------------------------
test-timeout = 5
internet-test-url = http://connect.rom.miui.com/generate_204
# 延迟测试端点用**境外** 204。
#
# ⚠️ 它是**性能探针**，不是泄露通道 —— 别拿"藏掉解析"的理由去改它。
# 走代理策略时解析发生在代理服务器（官方 KB：「DNS 解析永远在代理服务器进行」），
# 本地不产生查询。它的职责是给 smart 组 / 地区组打分，
# 而**分流版尤其依赖这个分数**：地区组的整个意义就是"同地区的节点谁最快"，
# 用境外端点测出的延迟含国际段，才贴近你真实访问境外站点的体感。
proxy-test-url = http://www.gstatic.com/generate_204
# 专用的 UDP 探针（QUIC 类策略 + smart 组的 UDP 评分都要用它）。

# --- 流量处理 ---------------------------------------------------------------
# 有节点不支持 UDP 时，让请求走代理侧解析后的 TCP，而不是直接失败。
udp-policy-not-supported-behaviour = reject
# 游戏模式：系统繁忙时优先处理 UDP 包。
# 代理策略默认已阻止 QUIC；这里显式声明，只在确实有用的地方放行 QUIC。

# --- 局域网共享与安全 --------------------------------------------------------
# 两者保持 false：局域网设备的共享出口由专用网关承担，本机不再开放代理
# 监听端口，暴露面直接归零。proxy-restricted-to-lan 保留：监听端口万一
# 重新启用时仍有子网锁兜底。

# --- Wi-Fi / 蜂窝行为 -------------------------------------------------------
# all-hybrid = true 会让每条 TCP 连接**和**每次 DNS 查询同时走 Wi-Fi + 蜂窝，
# 是明确的耗电与流量代价。保持 false。

# Real-IP 豁免：游戏机 / NTP / STUN 主机名必须拿到真实可路由地址而不是 fake-IP，
# 否则 NAT 类型检测和时间同步会坏。注意 Surge 内置的 SYSTEM 集合已覆盖 Apple 自家流量。
always-real-ip = *.lan, *.local, *.localdomain, *.home.arpa, *.srv.nintendo.net, *.stun.playstation.net, *.xboxlive.com, stun.*, time.*.com, ntp.*.com, *.pool.ntp.org, *.market.xiaomi.com

# ===========================================================================

[Proxy]
#
# 其余节点全部来自订阅（`Airport` 组的 `policy-path`）—— 所以地区组只需
# `include-other-group="Airport"` 就能拿到节点，**不需要** `include-all-proxies`。
#
# 要再加你自己的节点（自建 / 中转链 / 本地入口）就在这里写：`名字 = 类型, 服务器, 端口, 参数…`
#   ⚠️ 名字里带上地区关键词（如 `HK` / `香港`），地区组的 `policy-regex-filter` 才认得出。
#   ⚠️ 但**显式写在本节的节点不受 `policy-regex-filter` 影响** —— 官方原文：正则
#      "applies to members from policy-path, include-all-proxies, and include-other-group,
#      but not to explicitly listed members"。想让本机节点也进地区组，就给对应组补一个
#      `include-all-proxies=true`（本段默认不写死节点，故未启用该参数）。
#   ⚠️ AnyTLS / `https` 中转链：`underlying-proxy="落地节点名"` 指的名字必须真实存在，
#      否则 Surge 会以「无法解析 underlying-proxy」拒绝加载。
#
# 例（203.0.113.x 是 RFC 5737 文档地址段，不指向任何真实主机）：
# Node-HK-01 = hysteria2, 203.0.113.12, 52341, password=REPLACE_WITH_YOUR_PASSWORD, sni=REPLACE_WITH_YOUR_SNI

# ===========================================================================
# [Proxy Group] —— 分流版的全部机关都在这一段
#
# ⚠️ 先说一件**必须知道**的事，否则你会在官方文档里撞墙：
#
#   Egern 有 `flatten: true` —— 把「Proxy」这个**组名**在求值时替换成组内的
#   **全部具体节点**，于是 smart 可以逐个节点测速。**Surge 没有 flatten。**
#
#   Surge 的对应物是 `include-other-group="X"`：官方原文说它
#   "includes the **resolved member policies** from other policy groups" ——
#   同样是"复制已经解析出来的成员"，语义与 flatten 一致（可递归、可配正则）。
#
#   ⚠️ 但有一条硬限制（官方 Smart 组文档原文）：
#      「Smart 策略组不可以使用其他组作为子策略，也不可以用作 url-test 组的子策略。
#        但是可以使用 include-other-group 参数从其他组复制子策略。」
#
#   ⇒ 所以本配置按**用途**分两种写法，不是随意的风格差异：
#
#     ① 需要 smart 自动选优的地方（Smart / 6 个地区组）
#        → 用 `include-other-group` / `policy-path`，让 smart 拿到**具体节点**。
#          这是唯一能让 smart 真正对节点逐个测速的写法。
#          ⚠️ 订阅里的节点在这份配置里**只**被 ① 这一类组引用（Smart / 6 个地区组）；
#             懒人版相反 —— 那里的订阅节点直接进 `Proxy` / `AI` 两个 smart 组。
#
#     ② 需要「能复制到 Proxy 全部节点、又能在面板上手动接管」的地方
#        （11 个应用组：ChatGPT / Gemini / Claude / AI / Google / YouTube / YouTube Music /
#          Spotify /
#          YouTube / Google / Microsoft / Telegram / Twitter）
#        → 用 `select` + `include-other-group="Proxy"`，**与 Egern 逐字对齐**。
#          ⚠️ 成员只有「默认首项（有刻意取向时才写）+ `include-other-group`」，
#          **不再**把地区组名列进成员 —— Egern 的应用组 `policies` 同样只有
#          「首项 + `[Proxy]`」（外加 `flatten: true`），没有整份地区列表。
#          现有的默认首项：`Claude`→`Taiwan`、`ChatGPT` / `Gemini` / `Spotify` / `YouTube Music`→`United States`、
#          `Google`→`Gemini`、`Microsoft`→`DIRECT`，
#          其余八组不写首项 = 默认跟随 `Proxy` 的节点池。
#
#     ⚠️ 以下两组**不在 ② 之列**（都是纯 `select` + 字面量成员，不带 `include-other-group`）：
#        · `Proxy`（总入口）—— 成员是各组名（`Smart` / 6 个地区组），
#          首项是 `Smart`（全节点池 + 低倍率优先）；
#        （原 `Final` 兜底组已删，2026-10-05：兜底改由 `FINAL` 规则**直指 `Proxy`**，
#          与懒人版拉平 —— 该组只有一个成员、在面板上本就无从选择，留它无意义。）
#
#     ⚠️ 一个必须说清的差异：Egern 的应用组用的是 `fallback` / `smart`（**自动**故障转移），
#        Surge 的 `select` 是**纯手动**类型。所以本段的代理组给的是
#        「默认走 Proxy 的全部节点 + 面板上可手动改」，**没有**自动故障转移。
#        想要自动选优，把某个组换成 `smart, include-other-group="Proxy"` 即可
#        （代价：面板上不能再手动挑节点）。
# ===========================================================================

[Proxy Group]

# --- ① 总入口 ---------------------------------------------------------------
# ===========================================================================
# smart 组：按**真实连接的首字节延迟**、TCP 重传丢包、UDP 响应延迟三项给成员打分，
# 定期重测，并记住每个站点用哪个策略最合适。
#
# **首项是 `Smart`**（全节点池；Surge 侧另带低倍率优先，见下）。
#   ⚠️ Surfboard 不支持 `policy-priority`（官方语法参考未收录）⇒ 低倍率加权仅 Surge 侧生效；
#   代价要说清：默认出口会优先落在低倍率节点上，更省钱；
#   低倍率节点不可用、或比最优节点慢得多时，自动落到池内其它节点。
#
# **成员里不写任何写死的节点**：全部由 `Smart` / 6 个地区组代表，
#   它们各自 `include-other-group="Airport"`，节点来源统一是订阅。
#
# `include-other-group` 把订阅组里**具体节点**复制进来。
# 不这么写的话，smart 的成员会只有「Airport」这一个**组名单位**：
# 它测不到组内的节点，整组的"自动选优"就退化成"在几个组之间猜"。
Proxy = select, Smart, Hong Kong, Taiwan, Japan, Singapore, United States, Other Regions

# 全节点池。官方限制：`smart` 组只能装**具体节点**，成员写组单位会被**静默忽略** ——
#   所以这里放不进 `Proxy` 里的地区组那类成员，只能靠 `include-other-group` 把节点拉平进来。
# 用途：给需要"节点级候选"的地方当一个干净池子；它同时是 `Proxy` 的首项（默认出口）。
#
# `policy-priority` 给**低倍率节点**加权 0.15：分数 × 系数、越小越优先 ⇒
#   低倍率节点比当前最优节点**慢 6.7 倍以内**（= 1 ÷ 0.15）仍然胜出；超出这个差距、
#   或该节点不可用，则自动让位给池内其它节点 —— 这正是软偏好优于硬过滤之处。
#   正则 `(?<![\d.])0\.\d*[1-9]` 的三个锚点：
#     · `(?<![\d.])` 保证 `0.` 前面不是数字或点 ⇒ 排除 `10.1 倍率` / `100.12 GB` 的尾部
#     · `0\.` 锁定小数形态 ⇒ 排除整数 `1x` / `2x`
#     · `\d*[1-9]` 要求至少一位非零数字 ⇒ 排除无意义的 `0.0`
#   ⚠️ 残留风险：订阅若把「信息行」也塞成节点名，`剩余流量：0.5 TB` 仍会被加权。
#   ⚠️ **Surfboard 不支持 `policy-priority`**（官方语法参考策略组参数表未收录，2026-10-10）：
#      上面的低倍率加权仅 Surge 侧生效；Surfboard 侧本组退化为纯 url-test 选优，参数已删。
Smart = smart, include-other-group="Airport"

# ===========================================================================
# --- ② 应用组 ---------------------------------------------------------------
# ===========================================================================
# 与 Egern 的写法对应关系：
#
#   Egern                          Surge
#   ────────────────────────────   ─────────────────────────────────────────
#   policies: [Proxy]              select, include-other-group="Proxy"
#   + flatten: true
#
#   Egern 的 `flatten: true` 是把 `Proxy` 这个**组名**展开成它内部的**全部具体节点**，
#   组内做「节点级」的顺序尝试 / 故障转移 —— **不是**"把地区组列成成员"。
#
#   ⚠️ Surge 侧的一个差异必须说明：Egern 这里用的是 `fallback` / `smart` 类型（自动故障转移），
#      Surge 的 `select` 是**纯手动**类型。所以本段给的是
#      「默认走 Proxy 的全部节点 + 面板上可手动改」，**没有**自动故障转移。
#      想要自动选优，把某个组换成 `smart, include-other-group="Proxy"` 即可
#      （代价：面板上不能再手动挑节点）。
#
#   ⚠️ 成员只有组名，**没有**显式节点名 ——
#      这是 Surge 的硬约束：Smart 族组不接受组名成员，且显式成员不受
#      policy-regex-filter 影响。用组名当成员最干净。
#
#   ⚠️ **应用组一律逐地区组列出，不许用 `include-other-group="Proxy"`**（2026-10-06 用户定）：
#      `Proxy` 的整池会把 `Hong Kong` 与 `Other Regions` 一并带进来，无法单独摘除。
#      统一写法：`select, [默认首项,] Smart, Hong Kong, Taiwan, Japan, Singapore, United States`。
#      `Smart` 作**首选**（自动选优，真实连接打分）—— AI / YouTube / Emby / Telegram / Twitter 首项；
#      `Google` 次项（首项是 `Gemini`）。
#
#   ⚠️ **只有 AI 族四组**（`ChatGPT` / `Gemini` / `Claude` / `AI`）**不含 `Hong Kong`**
#      （2026-10-06 用户要求）；其余应用组**照常带 `Hong Kong`**，位置紧随首项之后。
#
#   ⭐ **仓级规矩（2026-10-06）：`Other Regions` 只能出现在 `Proxy` 的成员里。**
#      其它任何组都不得把它当子节点 —— 它是个"大杂烩"池，混进应用组会让出口落到
#      无法预期的地区。

# OpenAI / Sora / ChatGPT —— 默认走**美区**（United States），其后是各地区组。
# ⚠️ 不含 `Hong Kong`（见上方说明）。
ChatGPT = select, United States, Taiwan, Japan, Singapore

# Google 的 AI 服务。独立成组是因为下面的 `Google` 组首项指向它。默认走**美区**。
# ⚠️ 不含 `Hong Kong`（见上方说明）。
Gemini = select, United States, Taiwan, Japan, Singapore

# Anthropic / Claude —— 与 Egern 一致：默认走**台湾**组（Claude 对台湾线路较友好）。
# ⚠️ 订阅里没有台湾节点时这一组会空，指向它的规则会断；导入后到面板确认一下。
# ⚠️ 不含 `Hong Kong`（见上方说明）。
Claude = select, Taiwan, Japan, Singapore, United States

# 其余 AI 类域名（Repcz 的 AI.list 滚动维护）—— 之后并排本仓自托管 AI_Domains 整合集：
# googleapis.com 等宽后缀与认证/遥测基础设施域（伴生域不再漏出 AI 组），见 RULE-SET 区。
# 首项 `Smart`，其后是各地区组；**不含 `Hong Kong`**（见上方说明）。
AI = select, Smart, Taiwan, Japan, Singapore, United States

# GitHub —— 规则集仍引用（`GitHub.list`），但**不再单独成组**：本条直接指向 `Proxy`。
# 下方 RULE-SET 那条即此取向的落点。

# YouTube
YouTube = select, Smart, Hong Kong, Taiwan, Japan, Singapore, United States
# Emby —— 影视服务器（自用枚举 4 个域名，见本仓自托管 `rules/emby.list`）。
