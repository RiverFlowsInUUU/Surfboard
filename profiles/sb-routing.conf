# ===========================================================================
# --- ③ 订阅槽位 + 开关 ------------------------------------------------------
# ===========================================================================

# 订阅入口。只做一件事：把订阅链接里的节点拉进来。
# `hidden=true` 让它不在面板菜单里显示 —— 它本来就不该被手动选中，
# 引用它的永远是 `include-other-group="Airport"`。
#
# ⚠️ 把 URL 换成你自己的订阅。token 已用占位符，不含任何真实机场地址。
Airport = select, policy-path=https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN, update-interval=86400, hidden=true

# Microsoft —— 只要两个节点：`DIRECT` 与 `Proxy`（2026-10-06 用户要求）。
#   首项 `DIRECT`（Egern 的取向：微软服务直连优先，走代理反而慢）。
# ⚠️ 本组**不摊平** `Proxy` 的节点池，成员就是这两项 —— 面板上二选一，不做节点级挑选。
Microsoft = select, DIRECT, Proxy

# Apple 更新（OTA）—— 系统更新下载走哪个出口。
# 首项 `DIRECT` 即默认取向：更新包体积大，直连通常比绕代理更快、也不吃订阅流量。
# `REJECT` 是备选项：不想让设备自动下载更新时，面板上一键切过去即可。
# ⚠️ 本组**默认 DIRECT 就是「不拦」**，与 `AD` 组默认 REJECT 的取向相反 —— 这是刻意的。
Apple Update = select, DIRECT, REJECT

# 广告拦截的手动开关，不被规则引用。
# 拦截动作走字面量 `REJECT`（为了拿到 pre-matching 的 DNS 阶段拦截），
# 本组负责"面板上随时可切，给人工干预留一个入口"。
# 想让本组接管开关：把 [Rule] 里那条 RULE-SET 的策略从 `REJECT` 改成 `AD`，
# 但必须一并去掉 `pre-matching`。
AD = select, REJECT, DIRECT

# ===========================================================================
# --- ④ 地区组 ---------------------------------------------------------------
# ===========================================================================
# 每个地区组 = 「订阅里的节点」 + 「正则只保留该地区」 + 「低倍率优先」。
#
# ⚠️ `policy-priority` 与 `Smart` 同值同正则（系数 0.15 = 低倍率优先）—— **仅 Surge 侧**：
#    Surfboard 不支持该参数（语法参考未收录，2026-10-10），本文件已删去 7 处；
#    Surge 侧口径不变，要调就一起调。
#
# ⚠️ 本模板的地区组**只从订阅取节点**（`include-other-group="Airport"`），
#    正则对它生效，所以**不需要** `include-all-proxies`（与 Egern 一致）。
#    本段不写死任何节点，所谓"写死节点不进地区组"的情况默认不会发生 —— 见下一条。
#
# ⚠️ 但要知道：`policy-regex-filter` **对显式列出的成员无效**。官方 policy-including 原文：
#    "applies to members from policy-path, include-all-proxies, and include-other-group,
#     but not to explicitly listed members"。
#    ⇒ 你日后往 `[Proxy]` 加本机节点时，它们**不会**被正则筛进来；想筛，就给对应组补
#      `include-all-proxies=true`。
#
# ⚠️ 地区名是**两份拷贝**：每个地区组写自己的正则，而 `Other Regions` 的负向断言
#    把其它 5 个组的关键词又抄了一遍。**改任何一个地区组，都要同步改 Other Regions。**
#    校验：`python skill/scripts/surge/audit_region_filters.py surge/profiles/routing.conf`
#
# ⚠️ 空组是允许的（订阅里没有该地区的节点时就会空）。Surge 不会因此拒绝加载，
#    但如果某条规则指向了空组，那条规则的流量会断。导入后到面板上看一眼。

# 香港（含「深港 / 沪港 / 京港 / 广港」这类中转写法）
Hong Kong = smart, include-other-group="Airport", policy-regex-filter=(?i)🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港

# 中国台湾
Taiwan = smart, include-other-group="Airport", policy-regex-filter=(?i)🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b

# 日本
Japan = smart, include-other-group="Airport", policy-regex-filter=(?i)🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b

# 新加坡
Singapore = smart, include-other-group="Airport", policy-regex-filter=(?i)🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b

# 美国 —— 组名 `United States`（含主要城市名与机场三字码；`\bUSA?\b` 匹配 US / USA）
United States = smart, include-other-group="Airport", policy-regex-filter=(?i)🇺🇸|美国|United\s*States|America|\bUSA?\b|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|\b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b

# 其它地区 —— 用**负向断言**排除上面 5 个地区的全部关键词。
# 末尾那串 `倍率|剩余|到期|流量|官网|订阅|测试|有效|禁止|邮箱|客服|地址|网站|群组`
# 是为了把订阅里常见的"信息行节点"（「剩余流量：100GB」这种）也排除掉。
#
# ⚠️ 它的关键词与上面 5 个组**完全重复**，是本文件里最大的一处维护负担。
#    Surge 的 filter 不支持引用变量，消灭不掉 —— 只能靠脚本守，见上面的校验命令。
Other Regions = smart, include-other-group="Airport", policy-regex-filter=(?xi)^(?!.*(?:🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港|🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b|🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b|🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b|🇺🇸|美国|United\s*States|America|\bUSA?\b|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|\b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b|倍率|剩余|到期|流量|官网|订阅|测试|有效|禁止|邮箱|客服|地址|网站|群组)).+$

# ===========================================================================
[Rule]
# ---- 1. 广告白名单（防误杀层）----------------------------------------------
# 白名单是**最高优先级**：必须排在广告拦截（REJECT）之前，否则会被误杀。
# 顺序铁律「白名单 → 黑名单 → 常规分流」里的**白名单**即本节。
# ⚠️ **两层白名单的第二层（系统域 `SYSTEM`）不在此处**：2026-10-06 起它下移到
#     `2d`（Apple Update 之后、内网之前），依据见 2c / 2d 两段注释。
#
# 广告白名单 —— 会被广告黑名单误杀的功能域
# （条数随上游更新，故此处不写死；要现值跑 audit_ruleset_content.py）
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-direct.list,DIRECT,"update-interval=604800"

# ---- 2. 广告拦截：pre-matching REJECT --------------------------------------
# pre-matching 的 REJECT 在 **DNS 查询阶段和 TCP-SYN 阶段**就被求值，
# 被拦的请求得到一个 "No Record" / TCP RST 就结束了，连接层完全不会启动。
#
# 策略必须是**字面量** REJECT 族策略。写成策略组会加载失败：组的成员在运行时
# 可能解析成 DIRECT，Surge 无法据此保证"一定拦得住"。
#
# 想临时停用广告拦截：把策略改成 DIRECT，或整行注释掉。
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-ads.list,REJECT,"update-interval=604800"

# ---- 2b. 第二条广告清单：AWAvenue（秋风）------------------------------------
# 与 Egern 的两条并列结构对齐（先 Jinx、后 AWAvenue），策略与参数同 2 号，同为
# pre-matching REJECT —— 拦在 DNS / TCP-SYN 阶段，不额外起连接。
#
# 已核对该规则集本体（2026-09-22；条数随上游更新，不写死）：
#   DOMAIN 949 / DOMAIN-SUFFIX 12 / DOMAIN-KEYWORD 4，**100% 域名类**，
#   无 IP-CIDR / URL-REGEX / USER-AGENT ⇒ pre-matching 可用的类型。
#
# 补它的收益（按「净新增覆盖」量化，不是看总条数）：
#   相对 Jinx 黑名单，仍有少数 Jinx 未收录的广告域（具体数随两条清单上游更新而变，
#   要现值就现抓：`python skill/scripts/surge/audit_ruleset_content.py <本文件>`）。
#
# ⚠️ 顺序是这条的命门：AWAvenue 会命中上面白名单里的若干条功能域
#   （`jpush.cn` / `appcfg.v.qq.com` / 微信登录 `apd-pcdnwx*` / 字节 `tnc3-*` 等）。
#   白名单必须留在两条清单**之前**，否则这些域名会被误杀。
#   ⚠️ 这条**不能**挪到 `direct.txt` / `GEOIP,CN` 之后 —— 一旦落到国内直连规则后面就永远轮不到。
RULE-SET,https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list,REJECT,"update-interval=604800"

# ---- 2c. Apple 更新（OTA）—— 排在 `SYSTEM` 之前、广告拦截之后 ----------------
# 为什么在 `SYSTEM` 之前：两集有 **3 条重叠**（`configuration.apple.com` /
#   `mesu.apple.com` / `xp.apple.com`）。`SYSTEM` 会把它们接成 `DIRECT`，
#   于是本组**永远轮不到**这三条 —— 想让 Apple Update 组对 OTA 域真正生效，
#   它必须排在 `SYSTEM` 之前（规则集包含关系所致的前移，与 YouTubeMusic 之于
#   YouTube 同性质；Z0 一致性判据按「允许前移」处理）。
# ⚠️ 本集实测 **78 条、100% 域名类、零 IP**（DOMAIN 65 + DOMAIN-SUFFIX 13）
#   ⇒ 按 §4.4b「实测零 IP 不写规则级 no-resolve」的原则，本行不写该开关。
# ⚠️ 与两条广告清单实测**零交集** ⇒ 落在它们之后不会被误拦。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/SystemOTA/SystemOTA.list,Apple Update,"update-interval=604800"

# ---- 2d. 系统域白名单（`SYSTEM`）—— 排在 Apple Update 之后 ---------------
#     Apple 的激活 / 推送 / 定位 / 配对主机（mesu / captive / push / ess / lcdn-* 等）。
#     它是 Surge **内置**集合：不依赖网络下载，规则集加载失败也不会失效。
#     ⚠️ **落点依据（2026-10-06 变更）**：原口径是「系统域优先级高于一切 ⇒ 置顶」。
#        现改为**不置顶、落在 Apple Update 之后、内网之前**，依据换成下面两条实测：
#          · 与两条广告清单**零交集**（裸域名与后缀覆盖均为 0，2026-10-06 复测仍成立）
#            ⇒ 排在前或排在后，**拦截结果完全相同**；
#          · 与 Apple Update 集有 3 条重叠 ⇒ 排在它之后，让更新组能接管那 3 条。
#        ⇒ 顺序对结果无影响时，「让功能组生效」优先于「优先级象征」。
#     ⚠️ 内置 `SYSTEM` 不含 App Store / iTunes 内容服务（官方口径，见 `rules/apple_system.list` 头注）。
#     ⚠️ Egern 侧没有内置 `SYSTEM`：同一位置引用本仓自托管快照 `rules/apple_system.list`。
#     ⚠️ Surfboard 同样**没有** `RULE-SET,SYSTEM`（官方语法参考明示不支持）—— 与 Egern
#        同法，引用本仓自托管的 SYSTEM 快照（同一 URL）。代价：快照不随 Surge 版本自动
#        更新、多一次下载；但「系统域白名单」这条语义保住了，不至于整段丢掉。
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/rules/apple_system.list,DIRECT,"update-interval=604800"

# ---- 3. 局域网 / 内网 -------------------------------------------------------
